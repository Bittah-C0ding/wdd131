 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Kids Read For Fun — Book reviews and recommendations for children ages 10–14. Discover great fantasy, adventure, and more." />
  <title>Kids Read For Fun | Book Blog</title>

  <!-- Preconnect for Google Fonts performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Skip Navigation Link (Accessibility) -->
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <!-- ===== HEADER ===== -->
  <header class="site-header" role="banner">
    <div class="header-inner">
      <a href="index.html" class="site-title" aria-label="Kids Read For Fun — Home">
        Kids Read For Fun
      </a>

      <!-- Primary Navigation -->
      <nav class="site-nav" aria-label="Primary navigation">
        <ul class="nav-list" role="list">
          <li><a href="#about">About</a></li>
          <li><a href="#archive">Archive</a></li>
          <li><a href="#search">Search</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <main id="main-content" class="site-main">

    <!-- Book Review Article -->
    <article class="book-article" aria-label="Book review: Septimus Heap Book One: Magyk">

      <div class="book-grid">

        <!-- Meta Column -->
        <aside class="book-meta" aria-label="Book details">
          <time class="book-date" datetime="2022-07-05">July 5, 2022</time>
          <span class="book-age" aria-label="Recommended age range: 10 to 14">10-14</span>
          <span class="book-genre" aria-label="Genre: Fantasy">Fantasy</span>

          <!-- Star Rating -->
          <div class="book-rating" role="img" aria-label="Rating: 4 out of 5 stars">
            <span class="star" aria-hidden="true">&#9733;</span>
            <span class="star" aria-hidden="true">&#9733;</span>
            <span class="star" aria-hidden="true">&#9733;</span>
            <span class="star" aria-hidden="true">&#9733;</span>
            <span class="star star-empty" aria-hidden="true">&#9733;</span>
          </div>
        </aside>

        <!-- Content Column -->
        <div class="book-content">
          <h2 class="book-title">Septimus Heap Book One: Magyk</h2>

          <figure class="book-cover-wrap">
            <img
              class="book-cover"
              src="https://upload.wikimedia.org/wikipedia/en/5/5f/Magkycover2.jpg"
              alt="Book cover of Septimus Heap Book One: Magyk by Angie Sage — a blue decorated cover with gold lettering reading Magyk and illustrated with a ring and mystical symbols"
              width="220"
              height="336"
              loading="lazy"
            />
          </figure>

          <p class="book-description">
            If you enjoy stories about seventh sons of seventh sons and magyk this is the book for you.
          </p>
        </div>

      </div><!-- /.book-grid -->

    </article>

  </main>
